# ---------- Database ----------
# Production (Render): set DB_URL, DB_USERNAME and DB_PASSWORD to a MySQL database, e.g.
#   DB_URL=jdbc:mysql://<host>:3306/coderefine?useSSL=true&serverTimezone=UTC
# Local development: if DB_URL is not set, an embedded H2 file database is used.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/coderefine;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console is off by default; enable only for local debugging (H2_CONSOLE=true)
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# ---------- Server ----------
server.port=${PORT:8080}

# ---------- Security ----------
jwt.secret=${JWT_SECRET:change-this-default-jwt-secret-to-at-least-32-bytes}

# ---------- AI providers ----------
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.fallback-models=${GEMINI_FALLBACK_MODELS:}
ai.mistral.api-key=${MISTRAL_API_KEY:}
