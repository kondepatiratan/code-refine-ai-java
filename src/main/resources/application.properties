spring.datasource.url=jdbc:h2:file:./data/coderefine;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8093
jwt.secret=${JWT_SECRET:change-this-default-jwt-secret-to-at-least-32-bytes}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.fallback-models=${GEMINI_FALLBACK_MODELS:}
ai.mistral.api-key=${MISTRAL_API_KEY:}
